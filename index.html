<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenAI Activation Program Dashboard</title>
<style>
  :root{
    --purple-dark:#3d0066; --purple:#7a1fa2; --purple-mid:#a020f0; --purple-bright:#c026d3;
    --bg:#f4eef7; --card:#ffffff; --text:#2b0a3d; --muted:#7a6a86;
    --offshore:#7a1fa2; --onshore:#16a6c0; --am:#7a1fa2; --pm:#16a6c0; --light1:#efe2f7;
    --f-body: clamp(10px, 0.78vw, 13px);
    --f-h3:   clamp(11px, 0.9vw, 15px);
    --f-list: clamp(10px, 0.82vw, 13.5px);
    --f-small:clamp(8.5px, 0.62vw, 10.5px);
    --f-kpi:  clamp(12px, 1.05vw, 18px);
    --f-title:clamp(13px, 1.1vw, 19px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);font-size:var(--f-body);}
  .app{height:100vh;display:flex;flex-direction:column;overflow:hidden;}

  .banner{flex:0 0 auto;position:relative;background:linear-gradient(100deg,var(--purple-dark) 0%,var(--purple) 45%,var(--purple-mid) 80%,var(--purple-bright) 100%);color:#fff;padding:6px 24px 7px;overflow:hidden;text-align:center;}
  .banner::after{content:"";position:absolute;right:-60px;top:-50px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,0.16),transparent 60%);border-radius:50%;}
  .banner .eyebrow{font-size:var(--f-small);letter-spacing:2px;font-weight:700;opacity:.85;text-transform:uppercase;}
  .banner h1{font-size:var(--f-title);margin-top:1px;font-weight:700;}

  .day-bar{flex:0 0 auto;display:flex;flex-wrap:nowrap;gap:5px;padding:5px 24px 3px;}
  .day-cell{position:relative;flex:1 1 0;height:clamp(28px,2.4vw,36px);}
  .day-btn{position:absolute;inset:0;width:100%;height:100%;background:var(--light1);color:var(--purple-dark);border:1px solid #e2cef0;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-size:var(--f-body);font-weight:700;transition:background .18s,color .18s,box-shadow .18s;white-space:nowrap;z-index:1;overflow:hidden;}
  .day-cell:hover{z-index:40;}
  .day-btn:hover{background:linear-gradient(135deg,var(--purple) 0%,var(--purple-mid) 100%);color:#fff;box-shadow:0 5px 14px rgba(122,31,162,.3);}
  .day-btn.active{background:linear-gradient(135deg,var(--purple-dark) 0%,var(--purple-bright) 100%);color:#fff;box-shadow:0 5px 14px rgba(122,31,162,.4);}
  .slot-pills{display:none;gap:3px;}
  .day-btn.active .slot-pills{display:inline-flex;}
  .pill{background:rgba(255,255,255,.28);color:#fff;border:none;border-radius:4px;padding:1px 6px;font-size:var(--f-small);font-weight:700;cursor:pointer;transition:background .15s;}
  .pill:hover{background:rgba(255,255,255,.55);}
  .pill.on{background:#fff;color:var(--purple-dark);}
  .day-title{position:absolute;left:0;top:calc(100% + 4px);width:200px;background:#2b0a3d;color:#fff;font-size:var(--f-small);font-weight:600;line-height:1.3;padding:6px 8px;border-radius:7px;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s;z-index:50;}
  .day-cell:hover .day-title{opacity:1;visibility:visible;}

  .kpi-row{flex:0 0 auto;display:flex;gap:5px;padding:3px 24px 2px;flex-wrap:nowrap;}
  .kpi{flex:1 1 0;background:var(--card);border-radius:8px;padding:6px 8px;box-shadow:0 3px 10px rgba(60,0,102,0.06);min-width:0;text-align:center;}
  .kpi .k-lbl{font-size:var(--f-small);color:var(--muted);font-weight:600;line-height:1.1;}
  .kpi .k-val{font-size:var(--f-kpi);font-weight:800;color:var(--text);margin-top:1px;}

  .grid{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:6px 24px 10px;}
  .row{display:flex;gap:8px;min-height:0;}
  .row.top{flex:1.05 1 0;}
  .row.bot{flex:1.0 1 0;}
  .panel{background:var(--card);border-radius:10px;padding:9px 12px;box-shadow:0 3px 12px rgba(60,0,102,0.06);overflow:visible;display:flex;flex-direction:column;min-height:0;min-width:0;}
  .panel.clip{overflow:hidden;}
  .panel h3{flex:0 0 auto;font-size:var(--f-h3);color:var(--purple-dark);font-weight:700;margin-bottom:5px;}
  .panel .body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  svg{display:block;}

  .legend-row{flex:0 0 auto;font-size:var(--f-small);color:var(--muted);margin-bottom:2px;}
  .legend-row .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle;}

  .donut-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .donut-wrap svg{flex:1 1 auto;min-height:0;height:100%;width:auto;max-width:100%;}
  .donut-legend{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:var(--f-small);}
  .donut-legend .li{display:flex;align-items:center;gap:5px;}
  .donut-legend .sw{width:10px;height:10px;border-radius:3px;}
  .donut-legend .nm{color:var(--text);}
  .donut-legend .pc{font-weight:700;color:var(--purple-dark);}

  .hbars{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-around;overflow:hidden;}
  .hbars.scrollable{justify-content:flex-start;}
  .hbars.scrollable .hb{flex:0 0 20%;}
  .hbars.scrollable:hover{overflow-y:auto;}
  .hbars::-webkit-scrollbar{width:5px;} .hbars::-webkit-scrollbar-thumb{background:#c9b3da;border-radius:3px;}
  .hb{display:flex;align-items:center;gap:6px;}
  .hb .rank{width:16px;height:16px;border-radius:50%;background:#7a1fa2;color:#fff;font-size:var(--f-small);font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .hb .nm{font-size:var(--f-list);flex:0 0 58px;line-height:1.05;}
  .hb .barwrap{flex:1 1 auto;min-width:36px;display:flex;align-items:center;}
  .hb .fill{display:block;height:16px;background:#7a1fa2;border-radius:3px;min-width:2px;}
  .hb .val{font-size:var(--f-list);font-weight:700;color:#3d0066;flex:0 0 auto;min-width:78px;text-align:right;margin-left:6px;white-space:nowrap;}
  .hb.dim{opacity:.3;}
  .hb.hl .fill{background:#c026d3;}
  .hb.clickable{cursor:pointer;border-radius:6px;padding:1px 3px;transition:background .15s;}
  .hb.clickable:hover{background:#f2e8f8;}
  .hb.clickable:hover .fill{background:#c026d3;}

  .trend-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .trend-body svg{flex:1 1 auto;min-height:0;width:100%;height:100%;}

  .sum-col{flex:1 1 auto;min-height:0;overflow:auto;}
  .sum-col::-webkit-scrollbar{width:5px;} .sum-col::-webkit-scrollbar-thumb{background:#c9b3da;border-radius:3px;}
  .sum-col .s-title{font-size:var(--f-small);font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.5px;margin:0 0 4px;}
  .sum-col p{font-size:var(--f-list);line-height:1.5;color:var(--text);}
  .sum-col ul{margin:2px 0 0 15px;}
  .sum-col li{font-size:var(--f-list);line-height:1.45;margin-bottom:4px;}
  .sum-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
  .sum-head h3{font-size:var(--f-h3);color:var(--purple-dark);font-weight:700;}
  .sum-tag{background:var(--purple-mid);color:#fff;font-size:var(--f-small);font-weight:700;padding:2px 8px;border-radius:10px;}
  .res-btns{flex:0 0 auto;display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;position:relative;}
  .res-btn{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--purple),var(--purple-mid));color:#fff;border:none;border-radius:6px;padding:6px 11px;font-size:var(--f-small);font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s;}
  .res-btn.mat{background:linear-gradient(135deg,#5a1580,#7a1fa2);}
  .res-btn.readme{background:linear-gradient(135deg,#0f6f83,#16a6c0);}
  .res-btn.code{background:linear-gradient(135deg,#2b6f3a,#3ba55d);}
  .res-btn:hover{transform:translateY(-2px);}

  .dd{position:relative;display:inline-block;}
  .dd-menu{position:absolute;bottom:calc(100% + 6px);left:0;min-width:240px;max-width:340px;max-height:230px;overflow-y:auto;background:#fff;border:1px solid #d9c9e6;border-radius:9px;box-shadow:0 12px 28px rgba(60,0,102,.22);padding:5px;display:none;z-index:120;}
  .dd-menu.open{display:block;}
  .dd-menu::-webkit-scrollbar{width:6px;} .dd-menu::-webkit-scrollbar-thumb{background:#c9b3da;border-radius:3px;}
  .dd-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;font-size:var(--f-small);color:var(--text);text-decoration:none;line-height:1.25;}
  .dd-item .di-num{width:16px;height:16px;flex:0 0 auto;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:9px;}
  .dd-item.rd .di-num{background:#16a6c0;} .dd-item.rd:hover{background:#eefbfd;}
  .dd-item.cd .di-num{background:#3ba55d;} .dd-item.cd:hover{background:#eefdef;}
</style>
</head>

  const dayBar=document.getElementById('dayBar');
  DAYS.forEach(d=>{
    const cell=document.createElement('div'); cell.className='day-cell';
    cell.innerHTML=`<button class="day-btn" id="dayBtn${d}" onclick="clickDay(${d})">
        <span>DAY ${d}</span>
        <span class="slot-pills" id="pills${d}">
          <span class="pill" onclick="event.stopPropagation();selectSlot('am')" id="pillAM${d}">AM</span>
          <span class="pill" onclick="event.stopPropagation();selectSlot('pm')" id="pillPM${d}">PM</span>
        </span></button>
      <div class="day-title">DAY ${d}: ${titles[d]}</div>`;
    dayBar.appendChild(cell);
  });
  function clickDay(d){ if(selDay===d && selSlot===null){selDay=null;selSlot=null;} else {selDay=d;selSlot=null;} closeMenus(); refresh(); }
  function selectSlot(s){ if(selDay===null||selDay===7) return; selSlot=(selSlot===s)?null:s; closeMenus(); refresh(); }
  function gotoSession(d,s){ selDay=d; selSlot=s; closeMenus(); refresh(); }

  function polar(cx,cy,r,deg){const a=deg*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  function ringArc(cx,cy,rO,rI,a0,a1){const[x0o,y0o]=polar(cx,cy,rO,a0),[x1o,y1o]=polar(cx,cy,rO,a1),[x1i,y1i]=polar(cx,cy,rI,a1),[x0i,y0i]=polar(cx,cy,rI,a0);const lg=(a1-a0)>180?1:0;return`M ${x0o} ${y0o} A ${rO} ${rO} 0 ${lg} 1 ${x1o} ${y1o} L ${x1i} ${y1i} A ${rI} ${rI} 0 ${lg} 0 ${x0i} ${y0i} Z`;}
  function fullRing(cx,cy,rO,rI,color){ return `<circle cx="${cx}" cy="${cy}" r="${(rO+rI)/2}" fill="none" stroke="${color}" stroke-width="${rO-rI}"/>`; }

  const CW=470, PADL=22, PADR=24, CH=150, PADB=22, PADT=24;
  function xForIndex(i){ const n=DAYS.length; const step=(CW-PADL-PADR)/(n-1); return PADL+i*step; }

  function renderTrend(){
    const plotH=CH-PADT-PADB, maxY=100;
    const yOf=v=>PADT+plotH-(v/maxY)*plotH;
    let g='';
    function drawLine(slot, baseColor){
      const showLine=(selSlot===null)||(selSlot===slot); if(!showLine) return;
      const dimAll=(selDay!==null);
      const col=dimAll?'#cdbcdd':baseColor;
      const pts=DELIVERED.map(d=>({d,x:xForIndex(DAYS.indexOf(d)),y:yOf(slot==='am'?amPct(d):pmPct(d))}));
      let path=''; pts.forEach((p,i)=>{ path+=(i===0?'M':'L')+` ${p.x} ${p.y} `; });
      g+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>`;
      DAYS.forEach(d=>{
        const x=xForIndex(DAYS.indexOf(d));
        if(d===7){ if(selDay===null){ g+=`<circle cx="${x}" cy="${yOf(0)}" r="3" fill="#d64545"/>`; } return; }
        const val=(slot==='am'?amPct(d):pmPct(d)); const y=yOf(val); const isSelDay=(selDay===d);
        const dy=(slot==='am')?-6:12;
        if(!dimAll){
          g+=`<circle cx="${x}" cy="${y}" r="2.6" fill="${baseColor}"/>`;
          g+=`<text x="${x}" y="${y+dy}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${baseColor}">${val.toFixed(1)}%</text>`;
        } else if(isSelDay){
          g+=`<circle cx="${x}" cy="${y}" r="4" fill="${baseColor}"/>`;
          g+=`<text x="${x}" y="${y+dy}" text-anchor="middle" font-size="9" font-weight="700" fill="${baseColor}">${val.toFixed(1)}%</text>`;
        } else { g+=`<circle cx="${x}" cy="${y}" r="2.2" fill="#cdbcdd"/>`; }
      });
    }
    drawLine('am','var(--am)'); drawLine('pm','var(--pm)');
    if(selDay===null){ const x=xForIndex(DAYS.indexOf(7)); g+=`<text x="${x}" y="${yOf(0)-8}" text-anchor="middle" font-size="9" font-weight="700" fill="#d64545">Cancelled</text>`; }
    DAYS.forEach(d=>{ const x=xForIndex(DAYS.indexOf(d)); g+=`<text x="${x}" y="${CH-6}" text-anchor="middle" font-size="9" fill="#666">Day ${d}</text>`; });
    const legend=`<div class="legend-row"><span class="sw" style="background:var(--am)"></span>AM Session &nbsp;<span class="sw" style="background:var(--pm)"></span>PM Session</div>`;
    document.getElementById('trendChart').innerHTML=legend+`<svg viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
  }

  function donut(elId,segs,centerTop,centerBot){
    const total=segs.reduce((a,s)=>a+s.val,0); const cx=70,cy=70,rO=64,rI=39; let ang=-90,paths='';
    const nz=segs.filter(s=>s.val>0);
    if(nz.length===1){ paths=fullRing(cx,cy,rO,rI,nz[0].color); }
    else { segs.forEach(s=>{ if(s.val<=0)return; const sw=total?s.val/total*360:0; const a1=ang+sw; paths+=`<path d="${ringArc(cx,cy,rO,rI,ang,a1)}" fill="${s.color}"/>`; ang=a1; }); }
    let leg=''; segs.forEach(s=>{const pct=total?(s.val/total*100):0; leg+=`<div class="li"><span class="sw" style="background:${s.color}"></span><span class="nm">${s.label}</span><span class="pc">${s.val} (${pct.toFixed(1)}%)</span></div>`;});
    const svg=`<svg viewBox="0 0 140 140" preserveAspectRatio="xMidYMid meet"><g>${paths}</g><text x="70" y="68" text-anchor="middle" font-size="16" font-weight="800" fill="#2b0a3d">${centerTop}</text><text x="70" y="83" text-anchor="middle" font-size="8" fill="#7a6a86">${centerBot}</text></svg>`;
    document.getElementById(elId).innerHTML=`<div class="donut-wrap">${svg}<div class="donut-legend">${leg}</div></div>`;
  }
  function renderOffOn(){
    const a=scopeAgg(DATA,COPS.length); const off=offAtt(a),on=onAtt(a),tot=off+on;
    donut('offonChart',[{label:"Offshore",val:off,color:'var(--offshore)'},{label:"Onshore",val:on,color:'var(--onshore)'}],tot.toLocaleString(),"Attendees");
  }
  function renderCountry(){
    const a=scopeAgg(DATA,COPS.length);
    const cols=['#7a1fa2','#c026d3','#16a6c0','#e08a1e'];
    let segs=[{label:"India",val:offAtt(a),color:cols[0]}];
    COUNTRIES.forEach((c,i)=>segs.push({label:c,val:sum(a.on[c].att),color:cols[(i+1)%cols.length]}));
    segs=segs.filter(s=>s.val>0).sort((x,y)=>y.val-x.val);
    donut('countryChart',segs,segs.reduce((s,x)=>s+x.val,0).toLocaleString(),"Attendees");
  }

  function renderTopSessions(){
    let arr=[]; DELIVERED.forEach(d=>['am','pm'].forEach(s=>arr.push({d,s,pct:sessPct(d,s),cnt:sessAtt(d,s)})));
    arr.sort((a,b)=>b.pct-a.pct); const top=arr.slice(0,5); const maxP=top[0].pct||1;
    let h=''; top.forEach((t,i)=>{ const sel=(selDay===t.d&&(selSlot===null||selSlot===t.s));
      const cls=(selDay!==null&&!sel)?'dim':(sel?'hl':'');
      h+=`<div class="hb clickable ${cls}" onclick="gotoSession(${t.d},'${t.s}')" title="Open Day ${t.d} ${t.s.toUpperCase()}"><span class="rank">${i+1}</span><span class="nm">Day ${t.d} ${t.s.toUpperCase()}</span><span class="barwrap"><span class="fill" style="width:${t.pct/maxP*100}%"></span></span><span class="val">${t.pct.toFixed(1)}% (${t.cnt})</span></div>`; });
    document.getElementById('topSessions').innerHTML=h;
  }

  function renderCPbars(elId,cats,store){
    const a=scopeAgg(store,cats.length); const total=offAtt(a)+onAtt(a);
    let rows=cats.map((c,i)=>({c,v:a.off.att[i]+COUNTRIES.reduce((x,co)=>x+a.on[co].att[i],0)})).filter(r=>r.v>0).sort((x,y)=>y.v-x.v);
    const maxPct=rows.length?(rows[0].v/(total||1)*100):1;
    let h=''; rows.forEach((r,i)=>{ const pct=total?(r.v/total*100):0;
      h+=`<div class="hb"><span class="rank">${i+1}</span><span class="nm">${r.c}</span><span class="barwrap"><span class="fill" style="width:${pct/maxPct*100}%"></span></span><span class="val">${pct.toFixed(1)}% (${r.v})</span></div>`; });
    if(!rows.length) h='<div style="font-size:var(--f-list);color:#999">No attendees in scope.</div>';
    const el=document.getElementById(elId); el.innerHTML=h; el.scrollTop=0;
  }
  function renderCP(){ renderCPbars('copBars',COPS,DATA); renderCPbars('pracBars',PRACTICES,DATAP); }

  function countriesInScope(){
    const a=scopeAgg(DATA,COPS.length); let n=0;
    if(offAtt(a)>0) n++; COUNTRIES.forEach(c=>{ if(sum(a.on[c].att)>0) n++; }); return n;
  }

  function renderKPIs(){
    const a=scopeAgg(DATA,COPS.length); const att=offAtt(a)+onAtt(a);
    let target, overallPct, delivered, cancelled, avgPerDay;
    if(selDay===null){ target=AM_BASE; overallPct=DELIVERED.reduce((s,d)=>s+dayPct(d),0)/DELIVERED.length; delivered=20; cancelled=2; avgPerDay=Math.round(att/10); }
    else if(selSlot===null){ target=AM_BASE; overallPct=att/DAY_BASE*100; delivered=(selDay===7)?0:2; cancelled=(selDay===7)?2:0; avgPerDay=att; }
    else { target=(selSlot==='pm')?PM_BASE:AM_BASE; overallPct=att/target*100; delivered=(selDay===7)?0:1; cancelled=(selDay===7)?1:0; avgPerDay=att; }
    const cards=[
      {l:"Target Audience",v:target.toLocaleString()},
      {l:"Learning Engagements",v:att.toLocaleString()},
      {l:"Overall Attendance %",v:overallPct.toFixed(1)+"%"},
      {l:"Sessions Delivered",v:delivered},
      {l:"Sessions Cancelled",v:cancelled},
      {l:"Countries Represented",v:countriesInScope()},
      {l:"Peak Session Attendance",v:avgPerDay.toLocaleString()}
    ];
    document.getElementById('kpiRow').innerHTML=cards.map(c=>`<div class="kpi"><div class="k-lbl">${c.l}</div><div class="k-val">${c.v}</div></div>`).join('');
  }

  // ---- dropdown menus ----
  function toggleMenu(e,id){ e.stopPropagation(); const m=document.getElementById(id); if(!m) return; const wasOpen=m.classList.contains('open'); closeMenus(); if(!wasOpen) m.classList.add('open'); }
  function closeMenus(){ document.querySelectorAll('.dd-menu.open').forEach(m=>m.classList.remove('open')); }
  document.addEventListener('click',()=>closeMenus());

  function ddButtonHTML(kind, topicsMap){
    if(selDay===null || selDay===7) return '';
    const topics=(topicsMap[String(selDay)]||[]).filter(t=>isRealLink(t.link));
    if(!topics.length) return '';
    const menuId=kind+'Menu';
    const label=(kind==='readme')?'📖 README ▾':'&lt;/&gt; Code ▾';
    const cls=(kind==='readme')?'readme':'code';
    const icls=(kind==='readme')?'rd':'cd';
    let items=''; topics.forEach((t,i)=>{ items+=`<a class="dd-item ${icls}" href="${t.link}" target="_blank" rel="noopener"><span class="di-num">${i+1}</span><span>${t.name}</span></a>`; });
    return `<span class="dd">
        <a class="res-btn ${cls}" onclick="toggleMenu(event,'${menuId}')">${label}</a>
        <div class="dd-menu" id="${menuId}">${items}</div>
      </span>`;
  }

  function renderSummary(){
    const titleEl=document.getElementById('sumTitle'),tagEl=document.getElementById('sumTag'),sumBox=document.getElementById('sumBox'),obsBox=document.getElementById('obsBox'),res=document.getElementById('resBtns');
    let s,title,showTag=false,tagTxt='',matUrl='',vidUrl='';
    if(selDay===null){ s=programSummary; title="Program Overview"; }
    else { s=daySummary[selDay]||{intro:"This session was cancelled.",obs:[]}; title=`Day ${selDay} – ${titles[selDay].split('–')[0].trim()}`;
      matUrl=MATERIAL_LINKS[String(selDay)]||'';
      if(selSlot!==null){ showTag=true; tagTxt=selSlot.toUpperCase()+" Session"; vidUrl=(VIDEO_LINKS[String(selDay)]||{})[selSlot]||''; }
    }
    titleEl.textContent=title; tagEl.style.display=showTag?'inline-block':'none'; tagEl.textContent=tagTxt;
    sumBox.innerHTML=`<div class="s-title">Summary</div><p>${s.intro}</p>`;
    obsBox.innerHTML=`<div class="s-title">Key Topics</div><ul>${(s.obs||[]).map(o=>`<li>${o}</li>`).join('')}</ul>`;
    let rb='';
    if(selDay===null){
      if(HOME_VIDEO) rb+=`<a class="res-btn" onclick="openPopup('${HOME_VIDEO}')">▶ Video Link</a>`;
      if(HOME_MATERIAL) rb+=`<a class="res-btn mat" onclick="openPopup('${HOME_MATERIAL}')">📊 Slides</a>`;
    } else if(selDay!==7){
      if(selSlot!==null && vidUrl){ rb+=`<a class="res-btn" onclick="openPopup('${vidUrl}')">▶ Recording Link</a>`; }
      if(isRealLink(matUrl)){ rb+=`<a class="res-btn mat" onclick="openPopup('${matUrl}')">📊 Slides</a>`; }
    }
    rb+=ddButtonHTML('readme',README_TOPICS);   // README (only if links)
    rb+=ddButtonHTML('code',CODE_TOPICS);       // Code (only if links)
    res.innerHTML=rb;
  }
  function openPopup(url){ if(!url)return; const w=screen.availWidth||1400,h=screen.availHeight||900; window.open(url,'genaiPopup',`width=${w},height=${h},left=0,top=0,resizable=yes,scrollbars=yes`); }

  function refresh(){
    DAYS.forEach(d=>{ const b=document.getElementById('dayBtn'+d); b.classList.toggle('active',selDay===d);
      const am=document.getElementById('pillAM'+d), pm=document.getElementById('pillPM'+d);
      if(am){ am.classList.toggle('on',selDay===d&&selSlot==='am'); pm.classList.toggle('on',selDay===d&&selSlot==='pm'); }
    });
    if(selDay===7) selSlot=null;
    renderKPIs(); renderTrend(); renderOffOn(); renderCountry(); renderTopSessions(); renderCP(); renderSummary();
  }
  refresh();
</script>
</body>
</html>
